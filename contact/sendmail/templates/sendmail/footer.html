<footer>
    <div class="footer-content">
      <div class="link-grid">
        {% for link in links %}
          <div>
            <a class="icon {{ link.type }}" {% if link.label == "Privacy Policy" %} id="privacy" {% endif %} href="{{ link.url }}">{{ link.label }}</a>
            {% if link.label == "Privacy Policy" %}
            <dialog id="matomo">
              <div id="matomo-opt-out"></div>
              <script src="https://dh.gu.se/matomo/index.php?module=CoreAdminHome&action=optOutJS&divId=matomo-opt-out&language=auto&backgroundColor=FFFFFF&fontColor=000000&fontSize=1.5em&fontFamily=Barlow%20Condensed&showIntro=1"></script>
              <button class="close">close</button>
            </dialog>
            {% endif %}
          </div>
        {% endfor %}
      </div>
      <div class="partners">
        {% for partner in partners %}
          <a href="{{ partner.url }}">{{ partner.label }}</a>
        {% endfor %}
      </div>
    </div>
</footer>
<script type="text/javascript">        
  jQuery(document).ready(function () {
      ThanksRoy.mobileMenu();
      ThanksRoy.megaMenu('.no-touchevents #primary-nav');
  });
  const dialog = document.querySelector("dialog");
  const showButton = document.querySelector("#privacy");
  const closeButton = document.querySelector("dialog button");
  
  showButton.addEventListener("click", () => {
      dialog.showModal();
  });
  
  closeButton.addEventListener("click", () => {
      dialog.close();
  });
  </script>
